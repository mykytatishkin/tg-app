# Nginx config for Telegram Mini App: frontend (static) + /api proxy to backend
# 1. Build frontend: cd frontend && npm run build
# 2. Replace /path/to/tg-app with real path; replace your-domain.com with your domain
# 3. SSL: use certbot (apt install certbot python3-certbot-nginx && certbot --nginx -d your-domain.com)

server {
    listen 80;
    server_name your-domain.com;   # замените на ваш домен или _ для любого

    root /path/to/tg-app/frontend/dist;   # замените на полный путь к собранному frontend
    index index.html;

    # SPA: все запросы отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # API — проксируем на бэкенд (NestJS на порту 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Опционально: статика с кэшем
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}


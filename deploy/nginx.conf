# Nginx: фронт — Vite dev (5173), API — бэкенд (3000)
# Для Web App в Telegram нужен HTTPS: используйте nip.io (46.21.250.43.nip.io) или свой домен.
# Тогда: server_name 46.21.250.43.nip.io; и после certbot --nginx -d 46.21.250.43.nip.io будет HTTPS.

server {
    listen 80;
    server_name 46.21.250.43.nip.io;   # для HTTPS по IP; или your-domain.com; или _ для одного только HTTP

    # Фронт — проксируем на живой Vite dev server (npm run dev)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket для Vite HMR (hot reload)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # API — проксируем на бэкенд (NestJS на порту 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# После: sudo certbot --nginx -d 46.21.250.43.nip.io — certbot сам добавит listen 443 ssl.
